services:
  teslaxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: teslaxy:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Local test footage (copied from your remote server)
      - ../../teslacam:/footage:ro
      # Config storage (DB, Exports, Logs)
      - ./config:/config
    environment:
      - AUTH_ENABLED=false
      - GIN_MODE=release
    # GPU support disabled for initial Windows test run
    # (uncomment the block below if you have NVIDIA Container Toolkit + WSL2 GPU passthrough set up)
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]
    # runtime: nvidia
