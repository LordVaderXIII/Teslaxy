version: "3.8"

services:
  teslaxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: teslaxy:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount your TeslaCam drive (RecentClips, SavedClips, SentryClips) here.
      # Use :ro for browse-only. Switch to :rw when RETENTION_ENABLED deletes footage.
      - /mnt/user/isos/TeslaCam:/footage:ro
      # Config storage (DB, Exports, Logs, retention.json)
      - ./config:/config
    environment:
      - AUTH_ENABLED=false
      - GIN_MODE=release
      # Footage retention (disabled + dry-run by default — inspect logs before enabling deletes)
      - RETENTION_ENABLED=false
      - RETENTION_DRY_RUN=true
      - RETENTION_MAX_AGE_DAYS=90
      - RETENTION_MAX_SIZE_GB=300
      - RETENTION_INTERVAL_HOURS=24
      - RETENTION_MIN_FILE_AGE_MINUTES=15
      # NVIDIA Container Toolkit: required so the nvidia runtime injects libcuda / NVENC.
      # Without these, ffmpeg lists h264_nvenc but encode fails with "Cannot load libcuda.so.1".
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    networks:
      - teslaxy-net
    # GPU Support for FFmpeg hardware acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]
    runtime: nvidia

# Pinned subnet: stay clear of 192.168.3.0/24 and 192.168.86.0/24 (and .240/.241).
# unRAID docker-run installs must use the same pinned network.
networks:
  teslaxy-net:
    name: teslaxy-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.242.0/24
